scenarios:
  - name: "CRM Lead - Create lead and verify sequence and stage log"
    steps:
      - step: "Setup - create CRM stage"
        action: "create"
        model: "crm.stage"
        save_as: "stage1"
        values:
          name: "Test Stage 1 SSI Lead"
          sequence: 1

      - step: "Setup - create second CRM stage"
        action: "create"
        model: "crm.stage"
        save_as: "stage2"
        values:
          name: "Test Stage 2 SSI Lead"
          sequence: 2

      - step: "Setup - create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner SSI Lead"

      - step: "Create lead with stage"
        action: "create"
        model: "crm.lead"
        save_as: "lead"
        as_user: "base.user_admin"
        values:
          name: "/"
          stage_id: "EVAL: registry['stage1'].id"
          partner_id: "EVAL: registry['partner'].id"

      - step: "Assert stage log created for stage1"
        action: "search"
        model: "crm.lead.stage.log"
        domain:
          - ["lead_id", "=", "EVAL: registry['lead'].id"]
          - ["stage_id", "=", "EVAL: registry['stage1'].id"]
        save_as: "stage_log_1"
        expect_count: 1
        limit: 1

      - step: "Assert stage log 1 moved by admin"
        action: "assert"
        target: "stage_log_1"
        asserts:
          user_id:
            type: "m2o"
            expected_xml_id: "base.user_admin"

      - step: "Assert lead has stage set"
        action: "assert"
        target: "lead"
        asserts:
          stage_id:
            type: "value"
            operator: "is_truthy"

      - step: "Change lead stage"
        action: "write"
        target: "lead"
        as_user: "base.user_admin"
        values:
          stage_id: "EVAL: registry['stage2'].id"

      - step: "Assert stage log created for stage2"
        action: "search"
        model: "crm.lead.stage.log"
        domain:
          - ["lead_id", "=", "EVAL: registry['lead'].id"]
          - ["stage_id", "=", "EVAL: registry['stage2'].id"]
        save_as: "stage_log_2"
        expect_count: 1
        limit: 1

      - step: "Assert stage log 2 moved by admin"
        action: "assert"
        target: "stage_log_2"
        asserts:
          user_id:
            type: "m2o"
            expected_xml_id: "base.user_admin"

      - step: "Assert latest stage log id is set"
        action: "assert"
        target: "lead"
        asserts:
          latest_log_stage_id:
            type: "value"
            operator: "is_truthy"

  - name: "CRM Lead - Test contractor computed fields"
    steps:
      - step: "Create parent company partner"
        action: "create"
        model: "res.partner"
        save_as: "company_partner"
        values:
          name: "Test Contractor Company"
          is_company: true

      - step: "Create contact child of company"
        action: "create"
        model: "res.partner"
        save_as: "contact_partner"
        values:
          name: "Test Contractor Contact"
          parent_id: "EVAL: registry['company_partner'].id"
          type: "contact"

      - step: "Create lead with contractor"
        action: "create"
        model: "crm.lead"
        save_as: "lead_contractor"
        as_user: "base.user_admin"
        values:
          name: "Test Lead With Contractor"
          contractor_id: "EVAL: registry['company_partner'].id"

      - step: "Assert lead created with contractor set"
        action: "assert"
        target: "lead_contractor"
        asserts:
          contractor_id:
            type: "value"
            operator: "is_truthy"

  - name: "CRM Lead - Test team reminder propagation to leads"
    steps:
      - step: "Create CRM stage for reminder test"
        action: "create"
        model: "crm.stage"
        save_as: "reminder_stage"
        values:
          name: "Reminder Stage SSI Lead"
          sequence: 10

      - step: "Get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Get ir.model for crm.lead"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "crm.lead"]
        save_as: "crm_lead_model"
        limit: 1

      - step: "Create email template"
        action: "create"
        model: "mail.template"
        save_as: "email_tpl"
        values:
          name: "Test Reminder Template SSI Lead"
          model_id: "EVAL: registry['crm_lead_model'].id"
          subject: "Reminder: Lead has been in stage too long"
          body_html: "<p>Please review your lead.</p>"

      - step: "Create CRM sales team"
        action: "create"
        model: "crm.team"
        save_as: "team"
        values:
          name: "Test Sales Team SSI Lead"

      - step: "Create team reminder"
        action: "create"
        model: "crm.team.reminder"
        save_as: "team_reminder"
        values:
          team_id: "EVAL: registry['team'].id"
          stage_id: "EVAL: registry['reminder_stage'].id"
          days_on_stage: 1
          hours_on_stage: 0
          email_template_id: "EVAL: registry['email_tpl'].id"
          number_of_reminder: 2
          user_ids:
            - "EVAL: registry['admin_user'].id"

      - step: "Create lead under team"
        action: "create"
        model: "crm.lead"
        save_as: "team_lead"
        as_user: "base.user_admin"
        values:
          name: "Test Lead With Team Reminder"
          team_id: "EVAL: registry['team'].id"
          stage_id: "EVAL: registry['reminder_stage'].id"

      - step: "Assert lead reminder was created from team"
        action: "search"
        model: "crm.lead.reminder"
        domain:
          - ["lead_id", "=", "EVAL: registry['team_lead'].id"]
          - ["stage_id", "=", "EVAL: registry['reminder_stage'].id"]
        save_as: "lead_reminder"
        expect_count: 1
        limit: 1

      - step: "Assert lead reminder number_of_reminder is propagated"
        action: "assert"
        target: "lead_reminder"
        asserts:
          number_of_reminder:
            type: "value"
            expected: 2

  - name: "CRM Lead - Reminder count caps notifications at number_of_reminder"
    steps:
      - step: "Create CRM stage for reminder cap test"
        action: "create"
        model: "crm.stage"
        save_as: "cap_stage"
        values:
          name: "Reminder Cap Stage SSI Lead"
          sequence: 20

      - step: "Get admin user for cap test"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "cap_admin_user"

      - step: "Get ir.model for crm.lead (cap test)"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "crm.lead"]
        save_as: "cap_crm_lead_model"
        limit: 1

      - step: "Create email template for cap test"
        action: "create"
        model: "mail.template"
        save_as: "cap_email_tpl"
        values:
          name: "Reminder Cap Template SSI Lead"
          model_id: "EVAL: registry['cap_crm_lead_model'].id"
          subject: "Reminder: Lead has been in stage too long"
          body_html: "<p>Please review your lead.</p>"

      - step: "Create lead for cap test"
        action: "create"
        model: "crm.lead"
        save_as: "cap_lead"
        as_user: "base.user_admin"
        values:
          name: "Test Lead Reminder Cap"
          stage_id: "EVAL: registry['cap_stage'].id"

      - step: "Create lead reminder with threshold 0 and limit 2"
        action: "create"
        model: "crm.lead.reminder"
        save_as: "cap_reminder"
        values:
          lead_id: "EVAL: registry['cap_lead'].id"
          stage_id: "EVAL: registry['cap_stage'].id"
          days_on_stage: 0
          hours_on_stage: 0
          email_template_id: "EVAL: registry['cap_email_tpl'].id"
          number_of_reminder: 2
          user_ids:
            - "EVAL: registry['cap_admin_user'].id"

      - step: "First reminder check sends notification"
        action: "call"
        target: "cap_lead"
        method: "_check_and_send_reminders"

      - step: "Assert reminder_count is 1 after first check"
        action: "assert"
        target: "cap_reminder"
        asserts:
          reminder_count:
            type: "value"
            expected: 1

      - step: "Second reminder check sends notification"
        action: "call"
        target: "cap_lead"
        method: "_check_and_send_reminders"

      - step: "Assert reminder_count is 2 after second check"
        action: "assert"
        target: "cap_reminder"
        asserts:
          reminder_count:
            type: "value"
            expected: 2

      - step: "Third reminder check must NOT send (limit reached)"
        action: "call"
        target: "cap_lead"
        method: "_check_and_send_reminders"

      - step: "Assert reminder_count stays capped at 2"
        action: "assert"
        target: "cap_reminder"
        asserts:
          reminder_count:
            type: "value"
            expected: 2

  - name: "CRM Team Role - Master data CRUD"
    steps:
      - step: "Create role"
        action: "create"
        model: "crm_team_role"
        save_as: "role"
        values:
          name: "Presales"
          code: "PRESALES"

      - step: "Assert role created"
        action: "assert"
        target: "role"
        asserts:
          name:
            type: "value"
            expected: "Presales"

      - step: "Update role name"
        action: "write"
        target: "role"
        values:
          name: "Presales Updated"

      - step: "Assert role name updated"
        action: "assert"
        target: "role"
        asserts:
          name:
            type: "value"
            expected: "Presales Updated"

  - name: "CRM Team Member Role - Valid assignment to team members"
    steps:
      - step: "Create user A"
        action: "create"
        model: "res.users"
        save_as: "user_a"
        values:
          name: "Member Role Test User A"
          login: "member_role_test_user_a@example.com"

      - step: "Create user B"
        action: "create"
        model: "res.users"
        save_as: "user_b"
        values:
          name: "Member Role Test User B"
          login: "member_role_test_user_b@example.com"

      - step: "Create sales team with user A and B as members"
        action: "create"
        model: "crm.team"
        save_as: "member_team"
        values:
          name: "Test Sales Team Member Role"
          member_ids:
            - "EVAL: registry['user_a'].id"
            - "EVAL: registry['user_b'].id"

      - step: "Create role for assignment"
        action: "create"
        model: "crm_team_role"
        save_as: "assign_role"
        values:
          name: "Account Executive"
          code: "AE"

      - step: "Assign users A and B to role on team"
        action: "create"
        model: "crm.team.member_role"
        save_as: "member_role"
        values:
          team_id: "EVAL: registry['member_team'].id"
          role_id: "EVAL: registry['assign_role'].id"
          user_ids:
            - "EVAL: registry['user_a'].id"
            - "EVAL: registry['user_b'].id"

      - step: "Assert team has one member role line"
        action: "assert"
        target: "member_team"
        asserts:
          member_role_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Assert member role line has both users A and B assigned"
        action: "search"
        model: "crm.team.member_role"
        domain:
          - ["id", "=", "EVAL: registry['member_role'].id"]
          - ["user_ids", "in", "EVAL: [registry['user_a'].id]"]
          - ["user_ids", "in", "EVAL: [registry['user_b'].id]"]
        save_as: "member_role_both_users"
        expect_count: 1

      - step: "Unlink team"
        action: "call"
        target: "member_team"
        method: "unlink"

      - step: "Assert member role cascade-deleted with team"
        action: "search"
        model: "crm.team.member_role"
        domain:
          - ["id", "=", "EVAL: registry['member_role'].id"]
        save_as: "deleted_member_role"
        expect_count: 0

  - name: "CRM Team Member Role - Assignment without team membership"
    steps:
      - step: "Create non-member user"
        action: "create"
        model: "res.users"
        save_as: "non_member_user"
        values:
          name: "Member Role Test User Non-Member"
          login: "member_role_test_user_non_member@example.com"

      - step: "Create sales team without the non-member user"
        action: "create"
        model: "crm.team"
        save_as: "non_member_team"
        values:
          name: "Test Sales Team Non-Member Role"

      - step: "Create role for non-member assignment"
        action: "create"
        model: "crm_team_role"
        save_as: "non_member_assign_role"
        values:
          name: "Account Manager"
          code: "AM"

      - step: "Assign non-member user to role on team"
        action: "create"
        model: "crm.team.member_role"
        save_as: "non_member_role"
        values:
          team_id: "EVAL: registry['non_member_team'].id"
          role_id: "EVAL: registry['non_member_assign_role'].id"
          user_ids:
            - "EVAL: registry['non_member_user'].id"

      - step: "Assert non-member role assignment was created"
        action: "search"
        model: "crm.team.member_role"
        domain:
          - ["id", "=", "EVAL: registry['non_member_role'].id"]
          - ["user_ids", "in", "EVAL: [registry['non_member_user'].id]"]
        save_as: "non_member_role_created"
        expect_count: 1
